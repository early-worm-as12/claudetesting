<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My All-Time Albums</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>My All-Time Albums</h1>
    <p class="subtitle">A ranked list of my favorite albums, built from my own scoring system.</p>
  </header>

  <section class="stats-bar" id="stats-bar">
    <!-- Filled in by script.js -->
  </section>

  <section class="podium" id="podium">
    <!-- Top 3 albums, filled in by script.js -->
  </section>

  <section class="insights">
    <div class="insights-header">
      <h2 class="section-title">Insights</h2>
      <div class="activity-filter">
        <label for="activity-select">Time range</label>
        <select id="activity-select">
          <option value="all">All time</option>
          <option value="12">Last 12 months</option>
          <option value="24">Last 2 years</option>
          <option value="60">Last 5 years</option>
        </select>
      </div>
    </div>
    <p class="insights-summary" id="insights-summary"></p>
    <div class="chart-grid">
      <div class="chart-card" id="chart-by-year"></div>
      <div class="chart-card" id="chart-top-genres"></div>
      <div class="chart-card" id="chart-top-artists"></div>
      <div class="chart-card" id="chart-score-trend"></div>
    </div>
  </section>

  <section class="controls">
    <input type="text" id="search-input" placeholder="Search artist or album...">

    <select id="genre-filter">
      <option value="">All genres</option>
    </select>

    <select id="year-filter">
      <option value="">All years</option>
    </select>

    <select id="sort-select">
      <option value="rank">Sort: Rank (best first)</option>
      <option value="score-desc">Sort: Score (high to low)</option>
      <option value="year-desc">Sort: Year (newest first)</option>
      <option value="year-asc">Sort: Year (oldest first)</option>
      <option value="artist">Sort: Artist (A-Z)</option>
    </select>
  </section>

  <p class="results-count" id="results-count"></p>
  <p class="hint">Click any album for the full breakdown.</p>

  <main class="album-grid" id="album-grid">
    <!-- Album cards get inserted here by script.js -->
  </main>

  <p class="empty-message" id="empty-message" hidden>No albums match your search.</p>

  <footer class="site-footer">
    <p>Built with HTML, CSS, and JavaScript.</p>
  </footer>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-album-title" tabindex="-1">
      <button class="modal-close" id="modal-close" aria-label="Close details">&times;</button>

      <div class="modal-rank" id="modal-rank"></div>
      <h2 class="modal-album" id="modal-album-title"></h2>
      <p class="modal-artist" id="modal-artist"></p>

      <div class="modal-tags" id="modal-tags"></div>

      <dl class="modal-meta-grid" id="modal-meta-grid"></dl>

      <div class="modal-meter-row">
        <div class="modal-meter" id="modal-meter-score">
          <div class="modal-meter-label">
            <span>Overall score</span>
            <span class="modal-meter-value" id="modal-score-value"></span>
          </div>
          <div class="modal-meter-track"><div class="modal-meter-fill" id="modal-score-fill"></div></div>
        </div>
        <div class="modal-meter" id="modal-meter-personal">
          <div class="modal-meter-label">
            <span>Personal rating</span>
            <span class="modal-meter-value" id="modal-personal-value"></span>
          </div>
          <div class="modal-meter-track"><div class="modal-meter-fill" id="modal-personal-fill"></div></div>
        </div>
      </div>

      <p class="modal-favorite" id="modal-favorite"></p>
    </div>
  </div>

  <script src="albums.js"></script>
  <script src="charts.js"></script>
  <script src="script.js"></script>
</body>
</html>
